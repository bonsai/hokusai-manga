name: reviewer
version: 1.1.0
description: "VLM annotation of Hokusai Manga images. Writes reviews to docs/data and is consumed by the viewer skill."
entry_point: hokusai_reviewer.py
workers:
  - vlm_reviewer.py
  - hokusai_reviewer.py
  - batch_review.py
  - review_10_batch.py
  - review_10_batch_autoloop.py
commands:
  - name: review
    description: "Review images in docs/images (or a given directory) with a VLM"
    usage: "python agents/skills/reviewer/hokusai_reviewer.py [IMAGE_DIR] [--provider lmstudio] [--model tempura-qwen2.5-vl-3b] [--limit N]"
  - name: batch
    description: "Review all remaining images in batches of 10"
    usage: "python agents/skills/reviewer/review_10_batch_autoloop.py"
inputs:
  images: docs/images
outputs:
  jsonl: docs/data/hokusai_vlm_reviews.jsonl
  db: docs/data/hokusai_vlm_reviews.db
config_schema:
  provider:
    type: string
    enum: [lmstudio, openai, gemini, ollama, custom]
    default: lmstudio
  model:
    type: string
    default: "tempura-qwen2.5-vl-3b"
  api_base:
    type: string
    default: "http://localhost:1234/v1"
  api_key:
    type: string
    default: ""
  max_tokens:
    type: integer
    default: 1000
  temperature:
    type: number
    default: 0.3
  timeout:
    type: integer
    default: 120
