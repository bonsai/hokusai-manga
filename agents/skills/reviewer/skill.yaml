name: vlm_reviewer
version: 1.0.0
description: "Vision-Language Model reviewer for rendered frames. Supports LM Studio, OpenAI, Gemini, Ollama with MMX spacecraft preset prompts."
author: "MMX Project"
license: "MIT"
entry_point: vlm_reviewer.py
commands:
  - name: review
    description: "Review frames with VLM"
    usage: "vlm_reviewer review <frames_dir> [--prompt PROMPT] [--provider PROVIDER] [--model MODEL] [--sample N] [--output FILE]"
  - name: compare
    description: "Compare two version frame sets"
    usage: "vlm_reviewer compare <v1_dir> <v2_dir> [--criteria CRITERIA]"
config_schema:
  provider:
    type: string
    enum: [lmstudio, openai, gemini, ollama, custom]
    default: lmstudio
  model:
    type: string
    default: "tempura-qwen2.5-vl-3b"
  api_base:
    type: string
    default: "http://localhost:1234/v1"
  api_key:
    type: string
    default: ""
  max_tokens:
    type: integer
    default: 1000
  temperature:
    type: number
    default: 0.3
  timeout:
    type: integer
    default: 120
presets:
  mmx_full: "Complete 7-category MMX spacecraft review"
  mmx_lighting: "Lighting only assessment"
  mmx_colors: "Color accuracy only"
  mmx_camera: "Camera framing only"
  mmx_geometry: "Mesh integrity only"
  mmx_quick: "2-3 sentence summary"
