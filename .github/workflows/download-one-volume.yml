name: Download and package Hokusai Manga for LoRA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hokusai-manga-lora-dataset
  cancel-in-progress: false

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --upgrade Pillow

      - name: Download all 15 public NDL volumes
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failed=0
          # Hokusai Manga, volumes 1-15: NDL PIDs 851646-851660.
          for pid in $(seq 851646 851660); do
            echo "::group::Download NDL PID ${pid}"
            python scripts/download_ndl_iiif.py --pid "${pid}" --output output --delay 0.75
            result=$?
            if [ "$result" -ne 0 ]; then
              echo "Download errors for PID ${pid}; keeping logs and continuing."
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "download_failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare resized images and ZIP
        run: >-
          python scripts/package_lora_dataset.py
          --input output
          --output dist
          --max-side 1024
          --quality 88

      - name: Upload compact LoRA dataset
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hokusai-manga-lora-dataset
          path: |
            dist/hokusai_manga_lora_dataset.zip
            output/*/errors.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report incomplete downloads
        if: steps.download.outputs.download_failed == '1'
        run: |
          echo "One or more pages failed. See per-volume errors.txt files in the artifact."
          exit 1
